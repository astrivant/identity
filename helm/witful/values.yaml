## @section Synchronization workers
## @param workers Number of concurrent one-shot sync workers; positive integer with no chart-imposed maximum
workers: 1
## @param image.repository Image built from this checkout; publish to a private registry before cluster use
## @param image.tag Immutable application release or source tag
## @param image.pullPolicy Kubernetes image pull policy
image:
  repository: witful
  tag: "0.1.0"
  pullPolicy: IfNotPresent
## @param imagePullSecrets [array] Existing registry credential Secret names
imagePullSecrets: []
## @param source.existingSecret Secret containing the reviewed journal, mounted read-only
## @param source.journalKey Secret key projected as lessons.jsonl
source:
  existingSecret: witful-source
  journalKey: lessons.jsonl
## @param database.existingSecret Secret containing the PostgreSQL URI; never place credentials in values
## @param database.urlKey Key holding the PostgreSQL URI in that Secret
## @param database.namespace Shared identity partition; all cooperating workers must use the same value
## @param database.caSecret Optional Secret containing a private PostgreSQL CA
## @param database.caKey Secret key projected as root.crt
database:
  existingSecret: witful-database
  urlKey: url
  namespace: default
  caSecret: ""
  caKey: root.crt

## @section Job lifecycle
## @param job.suspend Suspend creation of worker pods
## @param job.terminationGracePeriodSeconds Time allowed before Kubernetes forcibly terminates a worker
## @param job.backoffLimit Number of failed pod retries
## @param job.activeDeadlineSeconds Maximum total job duration
## @param job.ttlSecondsAfterFinished Retain completed job status for this many seconds
job:
  suspend: false
  terminationGracePeriodSeconds: 30
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600

## @section Worker resources and placement
## @param resources.requests.cpu Requested worker CPU
## @param resources.requests.memory Requested worker memory
## @param resources.limits.cpu Maximum worker CPU
## @param resources.limits.memory Maximum worker memory
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

## @param scheduling.nodeSelector Worker node labels required for scheduling
## @param scheduling.tolerations [array] Worker pod tolerations
## @param scheduling.affinity Native worker affinity; mutually exclusive with the anti-affinity preset
## @param scheduling.podAntiAffinityPreset Worker separation by topologyKey; empty, soft preference, or hard requirement
## @param scheduling.topologyKey Failure domain used by the anti-affinity preset
## @param scheduling.topologySpreadConstraints [array] Native spread constraints; omitted selectors default to this release and Job revision
## @param scheduling.priorityClassName Existing PriorityClass for worker pods
## @param scheduling.schedulerName Optional scheduler override
scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset: ""
  topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  priorityClassName: ""
  schedulerName: ""
## @param podLabels Additional worker pod labels; chart identity labels are reserved
## @param podAnnotations Additional worker pod annotations
## @extra podSecurityContext Worker pod security context; defaults to unprivileged execution
## @param podSecurityContext.runAsNonRoot Require non-root worker execution
## @param podSecurityContext.runAsUser Worker user ID
## @param podSecurityContext.runAsGroup Worker group ID
## @param podSecurityContext.fsGroup Group allowed to read mounted Secrets
## @param podSecurityContext.seccompProfile.type Worker seccomp profile
## @extra containerSecurityContext Worker container security context
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation in worker containers
## @param containerSecurityContext.readOnlyRootFilesystem Require a read-only worker root filesystem
## @param containerSecurityContext.capabilities.drop Linux capabilities removed from workers
podLabels: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

## @section Development PostgreSQL
## @param postgresql.enabled Deploy a single-node development database; production should use a managed endpoint
## @param postgresql.image Pinned PostgreSQL development and test image
## @param postgresql.existingSecret Secret with a password key for the development database
## @param postgresql.passwordKey Password key in the development database Secret
## @param postgresql.database Development database name; align with the connection URI Secret
## @param postgresql.username Development database user; align with the connection URI Secret
## @param postgresql.storageSize Persistent data volume capacity
## @param postgresql.storageClass StorageClass name; empty uses the cluster default, a dash disables dynamic provisioning
## @param postgresql.resources.requests.cpu Requested database CPU
## @param postgresql.resources.requests.memory Requested database memory
## @param postgresql.resources.limits.cpu Maximum database CPU
## @param postgresql.resources.limits.memory Maximum database memory
## @param postgresql.readinessProbe.initialDelaySeconds Delay before the first database readiness check
## @param postgresql.readinessProbe.periodSeconds Interval between database readiness checks
## @param postgresql.readinessProbe.timeoutSeconds Timeout for each database readiness check
## @param postgresql.readinessProbe.successThreshold Successes needed to mark the database ready
## @param postgresql.readinessProbe.failureThreshold Failures needed to mark the database unready
## @param postgresql.nodeSelector Development database node selection
## @param postgresql.tolerations [array] Development database pod tolerations
## @param postgresql.affinity Development database native pod affinity
## @param postgresql.terminationGracePeriodSeconds Development database shutdown grace period
postgresql:
  enabled: false
  image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  existingSecret: witful-postgres
  storageSize: 1Gi
  passwordKey: password
  database: witful
  username: witful
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
