## @section Synchronization workers
## @param workers Number of concurrent one-shot sync workers; positive integer with no chart-imposed maximum
workers: 1
## @param image.repository Image built from this checkout; publish to a private registry before cluster use
## @param image.tag Immutable application release or source tag
## @param image.pullPolicy Kubernetes image pull policy
image:
  repository: witful
  tag: "0.1.0"
  pullPolicy: IfNotPresent
## @param imagePullSecrets [array] Existing registry credential Secret names
imagePullSecrets: []
## @param source.existingSecret Secret containing the reviewed journal, mounted read-only
## @param source.journalKey Secret key projected as lessons.jsonl
source:
  existingSecret: witful-source
  journalKey: lessons.jsonl
## @param database.existingSecret Secret containing the PostgreSQL URI; never place credentials in values
## @param database.urlKey Key holding the PostgreSQL URI in that Secret
## @param database.namespace Shared identity partition; all cooperating workers must use the same value
## @param database.caSecret Optional Secret containing a private PostgreSQL CA
## @param database.caKey Secret key projected as root.crt
database:
  existingSecret: witful-database
  urlKey: url
  namespace: default
  caSecret: ""
  caKey: root.crt

## @section Job lifecycle
## @param job.suspend Suspend creation of worker pods
## @param job.terminationGracePeriodSeconds Time allowed before Kubernetes forcibly terminates a worker
## @param job.backoffLimit Number of failed pod retries
## @param job.activeDeadlineSeconds Maximum total job duration
## @param job.ttlSecondsAfterFinished Retain completed job status for this many seconds
job:
  suspend: false
  terminationGracePeriodSeconds: 30
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600

## @section Worker resources and placement
## @param resources.requests.cpu Requested worker CPU
## @param resources.requests.memory Requested worker memory
## @param resources.limits.cpu Maximum worker CPU
## @param resources.limits.memory Maximum worker memory
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

## @param scheduling.nodeSelector Worker node labels required for scheduling
## @param scheduling.tolerations [array] Worker pod tolerations
## @param scheduling.affinity Native worker affinity; mutually exclusive with the anti-affinity preset
## @param scheduling.podAntiAffinityPreset Worker separation by topologyKey; empty, soft preference, or hard requirement
## @param scheduling.topologyKey Failure domain used by the anti-affinity preset
## @param scheduling.topologySpreadConstraints [array] Native spread constraints; omitted selectors default to this release and Job revision
## @param scheduling.priorityClassName Existing PriorityClass for worker pods
## @param scheduling.schedulerName Optional scheduler override
scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset: ""
  topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  priorityClassName: ""
  schedulerName: ""
## @param podLabels Additional worker pod labels; chart identity labels are reserved
## @param podAnnotations Additional worker pod annotations
## @extra podSecurityContext Worker pod security context; defaults to unprivileged execution
## @param podSecurityContext.runAsNonRoot Require non-root worker execution
## @param podSecurityContext.runAsUser Worker user ID
## @param podSecurityContext.runAsGroup Worker group ID
## @param podSecurityContext.fsGroup Group allowed to read mounted Secrets
## @param podSecurityContext.seccompProfile.type Worker seccomp profile
## @extra containerSecurityContext Worker container security context
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation in worker containers
## @param containerSecurityContext.readOnlyRootFilesystem Require a read-only worker root filesystem
## @param containerSecurityContext.capabilities.drop Linux capabilities removed from workers
podLabels: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

## @section PostgreSQL operator
## @param cloudnative-pg.enabled Install the locked CloudNativePG operator dependency; leave false when the cluster already has an operator
## @extra cloudnative-pg Operator chart overrides; all upstream parameters remain available under this namespace
cloudnative-pg:
  enabled: false

## @section Managed PostgreSQL
## @param postgresql.enabled Create a CloudNativePG Cluster; its CRDs and ready controller must exist before enabling this
## @extra postgresql.spec Native CloudNativePG Cluster spec, validated from the locked dependency CRD; supports the complete upstream configuration surface
## @param postgresql.spec.instances PostgreSQL instance count, including the primary; positive integer with no chart-imposed maximum
## @param postgresql.spec.imageName Operator-compatible PostgreSQL image pinned by OCI digest
## @param postgresql.spec.enableSuperuserAccess Allow external superuser credentials; disabled by default
## @param postgresql.spec.bootstrap.initdb.database Application database created on first bootstrap
## @param postgresql.spec.bootstrap.initdb.owner Application database owner created on first bootstrap
## @param postgresql.spec.bootstrap.initdb.secret.name Existing kubernetes.io/basic-auth Secret with username and password keys; username must match owner
## @param postgresql.spec.storage.size Persistent storage capacity per PostgreSQL instance
## @param postgresql.spec.resources.requests.cpu Requested CPU per database instance
## @param postgresql.spec.resources.requests.memory Requested memory per database instance
## @param postgresql.spec.resources.limits.cpu CPU limit per database instance
## @param postgresql.spec.resources.limits.memory Memory limit per database instance
## @param postgresql.spec.affinity.enablePodAntiAffinity Spread database instances across eligible nodes
## @param postgresql.spec.affinity.podAntiAffinityType Preferred or required database pod anti-affinity
## @param postgresql.spec.affinity.topologyKey Failure domain label used for database separation
## @param postgresql.spec.smartShutdownTimeout Seconds for the operator to wait for client disconnection before fast shutdown
## @param postgresql.spec.stopDelay Total seconds allowed for PostgreSQL shutdown before forced termination
postgresql:
  enabled: false
  spec:
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1
    enableSuperuserAccess: false
    bootstrap:
      initdb:
        database: witful
        owner: witful
        secret:
          name: witful-postgres
    storage:
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    affinity:
      enablePodAntiAffinity: true
      podAntiAffinityType: preferred
      topologyKey: kubernetes.io/hostname
    smartShutdownTimeout: 30
    stopDelay: 60
