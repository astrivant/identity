{{- if not .Values.controller.enabled }}
{{- include "witful.validatePlacement" (dict "settings" .Values.sync "root" . "path" "sync") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sync-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: witful
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  suspend: {{ .Values.sync.job.suspend }}
  parallelism: {{ .Values.sync.workers }}
  completions: {{ .Values.sync.workers }}
  backoffLimit: {{ .Values.sync.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.sync.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.sync.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "witful.workerSelector" . | nindent 8 }}
        {{- with .Values.sync.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.sync.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.sync.job.terminationGracePeriodSeconds }}
      {{- with .Values.sync.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sync.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sync.scheduling.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.sync.scheduling.schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- if .Values.sync.scheduling.affinity }}
      affinity:
        {{- toYaml .Values.sync.scheduling.affinity | nindent 8 }}
      {{- else if .Values.sync.scheduling.podAntiAffinityPreset }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.sync.scheduling.podAntiAffinityPreset "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .Values.sync.scheduling.topologyKey | quote }}
              labelSelector:
                matchLabels:
                  {{- include "witful.workerSelector" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.sync.scheduling.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    {{- include "witful.workerSelector" . | nindent 20 }}
          {{- end }}
      {{- end }}
      {{- with .Values.sync.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        {{/* Preserve caller selectors; default only missing selectors to this exact Job. */}}
        {{- $constraint := deepCopy . }}
        {{- if not (hasKey $constraint "labelSelector") }}
        {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (include "witful.workerSelector" $ | fromYaml)) }}
        {{- end }}
        - {{- toYaml $constraint | nindent 10 }}
        {{- end }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.sync.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.sync.podSecurityContext | nindent 8 }}
      containers:
        - name: witful
          image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
          imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
          command: [/usr/bin/tini, -g, --, witful]
          args: [lessons, --repo, /source, sync]
          env:
            - name: WITFUL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sync.database.existingSecret | quote }}
                  key: {{ .Values.sync.database.urlKey | quote }}
            - name: WITFUL_DATABASE_NAMESPACE
              value: {{ .Values.sync.database.namespace | quote }}
            {{- if .Values.sync.database.caSecret }}
            - name: PGSSLROOTCERT
              value: /etc/postgres/root.crt
            {{- end }}
          securityContext:
            {{- toYaml .Values.sync.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.sync.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            {{- if .Values.sync.database.caSecret }}
            - name: ca
              mountPath: /etc/postgres
              readOnly: true
            {{- end }}
      volumes:
        - name: source
          secret:
            secretName: {{ .Values.sync.source.existingSecret | quote }}
            items:
              - key: {{ .Values.sync.source.journalKey | quote }}
                path: lessons.jsonl
            defaultMode: 0440
        {{- if .Values.sync.database.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.sync.database.caSecret | quote }}
            items:
              - key: {{ .Values.sync.database.caKey | quote }}
                path: root.crt
            defaultMode: 0440
        {{- end }}
{{- end }}
