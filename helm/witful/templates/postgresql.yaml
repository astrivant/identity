{{- if .Values.postgresql.enabled }}
# The operator owns Pods, Services, replication, failover, and volume lifecycle.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- toYaml .Values.postgresql.spec | nindent 2 }}
{{- end }}
