apiVersion: v2
name: witful
description: Run reviewed guidance synchronization or an explicitly enabled protected native identity controller.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/astrivant/identity/blob/main/docs/storage.md
sources:
  - https://github.com/astrivant/identity
  - https://github.com/astrivant/identity/tree/main/helm/witful
keywords:
  - ai-agents
  - knowledge
  - policy
  - lessons
  - postgresql
  - synchronization
maintainers:
  - name: emmeowzing
    url: https://github.com/emmeowzing
# Registry extensions use Artifact Hub's documented annotation names and string values.
# https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: BUSL-1.1
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/astrivant/identity/blob/main/docs/storage.md
    - name: Configuration
      url: https://github.com/astrivant/identity/blob/main/helm/witful/README.md
    - name: support
      url: https://github.com/astrivant/identity/issues
    - name: Security
      url: https://github.com/astrivant/identity/blob/main/SECURITY.md
dependencies:
  - name: cloudnative-pg
    version: "0.29.1"
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
