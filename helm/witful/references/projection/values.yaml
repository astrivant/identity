## @param controller.configuration.tls.client_certificate Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.tls.client_key Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.runtime.workers Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.runtime.threads Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.runtime.admission Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.runtime.working_directory Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.runtime.graceful_timeout Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.budget.revisions Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.budget.refs Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.budget.seconds Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.budget.bytes Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.role Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.projection.mode Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.configuration.gateway [array] Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.secretEnvironment.WITFUL_AUTHORITY_DATABASE_URL.name Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.secretEnvironment.WITFUL_AUTHORITY_DATABASE_URL.key Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.secretMounts [array] Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.networkPolicy.enabled Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.networkPolicy.ingress [array] Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.networkPolicy.egress [array] Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.pdb.enabled Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param controller.pdb.minAvailable Reviewed gateway input; replace placeholders and independently sign the complete configuration
## @param scheduling.podAntiAffinityPreset Reviewed gateway input; replace placeholders and independently sign the complete configuration
controller:
  enabled: true
  replicas: 1
  configuration:
    backend:
      id: 00000000-0000-4000-8000-000000000001
    broker:
      url: https://broker.keys.svc:8443
      ca: /etc/broker-tls/ca.pem
      certificate: /etc/broker-tls/client.pem
      key: /etc/broker-tls/client.key
      wrapping: 00000000-0000-4000-8000-000000000002
      signing: 00000000-0000-4000-8000-000000000003
      authority: 00000000-0000-4000-8000-000000000004
      policy: 00000000-0000-4000-8000-000000000005
      signers:
      - generation: 00000000-0000-4000-8000-000000000003
        public: REPLACE_WITH_TRUSTED_BASE64_DER_PUBLIC_KEY
        fingerprint: REPLACE_WITH_INDEPENDENT_SHA256_PIN
    probe:
      tenant: 00000000-0000-4000-8000-000000000006
      identity: 00000000-0000-4000-8000-000000000007
      grant: 00000000-0000-4000-8000-000000000008
      task: 00000000-0000-4000-8000-000000000009
      epoch: 1
      policy: 00000000-0000-4000-8000-000000000010
      envelope: /etc/projection-probe/envelope.cbor
    protection:
      path: /etc/protection/evidence.cbor
      public: REPLACE_WITH_TRUSTED_BASE64_RAW_PUBLIC_KEY
      fingerprint: REPLACE_WITH_INDEPENDENT_SHA256_PIN
    tls:
      certificate: /etc/native-tls/server.pem
      key: /etc/native-tls/server.key
      ca: /etc/native-tls/ca.pem
      server_name: witful-native
      client_certificate: /etc/native-tls/probe.pem
      client_key: /etc/native-tls/probe.key
    runtime:
      workers: 1
      threads: 4
      admission: 4
      working_directory: /run/witful
      graceful_timeout: 30
    budget:
      revisions: 4096
      refs: 256
      seconds: 30.0
      bytes: 67108864
    role: projection
    projection:
      mode: disabled
    gateway:
    - id: 00000000-0000-4000-8000-000000000021
      tenant: 00000000-0000-4000-8000-000000000006
      identity: 00000000-0000-4000-8000-000000000007
      url: ssh://git@git.example.invalid/approved/identity.git
      ref: refs/heads/projection
      directory: /run/witful/destination
      ssh_key: /etc/projection-ssh/key
      known_hosts: /etc/projection-ssh/known_hosts
      author: Witful projection service
      email: projection@example.invalid
  secretEnvironment:
    WITFUL_AUTHORITY_DATABASE_URL:
      name: native-authority-connection
      key: url
  secretMounts:
  - name: native-tls
    secretName: native-tls
    mountPath: /etc/native-tls
    items:
    - key: server.pem
      path: server.pem
    - key: server.key
      path: server.key
    - key: ca.pem
      path: ca.pem
    - key: probe.pem
      path: probe.pem
    - key: probe.key
      path: probe.key
  - name: broker-tls
    secretName: projection-broker-tls
    mountPath: /etc/broker-tls
    items:
    - key: client.pem
      path: client.pem
    - key: client.key
      path: client.key
    - key: ca.pem
      path: ca.pem
  - name: protection
    secretName: protection
    mountPath: /etc/protection
    items:
    - key: evidence.cbor
      path: evidence.cbor
  - name: projection-ssh
    secretName: projection-repository-ssh
    mountPath: /etc/projection-ssh
    items:
    - key: key
      path: key
    - key: known_hosts
      path: known_hosts
  - name: projection-probe
    secretName: projection-readiness
    mountPath: /etc/projection-probe
    items:
    - key: envelope.cbor
      path: envelope.cbor
  networkPolicy:
    enabled: true
    ingress: []
    egress: []
  pdb:
    enabled: true
    minAvailable: 0
scheduling:
  podAntiAffinityPreset: hard
