name: Adaptive Python and Pact tests
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
    outputs:
      scope:
        value: ${{ jobs.plan.outputs.scope }}
      capture:
        value: ${{ jobs.plan.outputs.capture }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
  PACT_DO_NOT_TRACK: '1'
  PYTHONPATH: scripts/ci:scripts:pkg
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      workers: ${{ steps.plan.outputs.workers }}
      scope: ${{ steps.scope.outputs.scope }}
      capture: ${{ steps.capture.outputs.enabled }}
    steps:
      - name: Mark planner start for elapsed completion time
        run: echo "TEST_MATRIX_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/python
      - id: scope
        run: python scripts/ci/test-matrix.py scope
      - id: capture
        run: python scripts/ci/test-matrix.py capture
      # PRs and tags may read compatible main feedback; only verified main runs save it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci/tests/state.json
          key: test-costs-v1-${{ steps.scope.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-costs-v1-${{ steps.scope.outputs.scope }}-
      - run: pytest -n 0 -p test_matrix.plugin --collect-only -q --matrix-collect=.cache/ci/tests/nodes.json
      - id: plan
        run: python scripts/ci/test-matrix.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-plan
          path: .cache/ci/tests/plan.json
          include-hidden-files: true
          if-no-files-found: error

  worker:
    needs: plan
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      WITFUL_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres?sslmode=disable
      COVERAGE_FILE: .cache/ci/tests/result/.coverage.${{ matrix.shard }}
      WITFUL_PACT_OUTPUT: .cache/ci/tests/result/pacts
      SHARD: ${{ matrix.shard }}
      WORKERS: ${{ needs.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-plan
          path: .cache/ci/tests/
      - run: >-
          pytest -n "$WORKERS" -p test_matrix.plugin --matrix-plan=.cache/ci/tests/plan.json
          --matrix-shard="$SHARD" --matrix-report=.cache/ci/tests/result/report.json
          --cov=witful --cov-branch --cov-report=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-shard-${{ matrix.shard }}
          path: .cache/ci/tests/result/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [plan, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-plan
          path: .cache/ci/tests/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          path: .cache/ci/tests/shards/
      - name: Require complete coverage before learning or reporting
        run: |
          python scripts/ci/test-matrix.py finish
          coverage combine --keep .cache/ci/tests/shards/*
          coverage report
          coverage json -o .cache/coverage/report.json
          coverage xml -o .cache/coverage/report.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - run: node scripts/ci/coverage-badge.mjs .cache/coverage/report.json .cache/coverage/badges "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: .cache/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-feedback
          path: |
            .cache/ci/tests/state.json
            .cache/ci/tests/sample.json
            .cache/ci/tests/publication.json
            .cache/ci/tests/publication/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
