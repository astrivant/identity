name: Provider API contracts
on:
  workflow_call:
    inputs:
      source:
        description: Immutable source revision to validate
        required: true
        type: string
      refresh-latest:
        description: Resolve and test current vendor specification heads before a tag release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/python
      - name: Verify snapshots against immutable vendor sources
        run: python scripts/ci/provider_contracts/refresh.py --check
      - name: Refresh current upstream contracts for tag acceptance
        if: inputs.refresh-latest
        run: python scripts/ci/provider_contracts/refresh.py --latest
      - name: Bind SDK versions and tested API contracts to this source
        env:
          SOURCE_REVISION: ${{ inputs.source }}
        run: python scripts/ci/provider_contracts/report.py --source "$SOURCE_REVISION" --output .cache/provider-contracts/provenance.json
      - name: Exercise SDKs against isolated HTTP mock servers
        run: pytest -n 0 scripts/ci/tests/test_provider_contracts.py --junitxml=.cache/provider-contracts/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: provider-contracts
          path: .cache/provider-contracts/
          if-no-files-found: error
          retention-days: 14
