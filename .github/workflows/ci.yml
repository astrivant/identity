name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sapience-${{ github.ref }}
  cancel-in-progress: false
env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SAPIENCE_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: pytest -n 4

  lint:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: |
          ruff check pkg scripts
          ruff format --check pkg scripts
          mypy
          pydocstyle pkg scripts
          pydoclint pkg scripts
          sqlfluff lint pkg/sapience/sql pkg/sapience/storage/tests pkg/sapience/life/tests
          git ls-files -z 'scripts/*.sh' | xargs -0 shellcheck -x
          git ls-files -z 'scripts/*.sh' | xargs -0 shfmt -d -i 4 -ci
          python scripts/documentation/update-contents.py --check

  privacy:
    name: PII scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: sapience privacy scan

  distributions:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - name: Build immutable tag or source version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python scripts/release/prepare.py
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          poetry build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  orchestration:
    # Chart and image validation are independent of Python tests and plot generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore chart tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/chart/node_modules
          key: chart-tools-${{ runner.os }}-${{ hashFiles('scripts/chart/package-lock.json') }}
      - name: Regenerate chart documentation and schema
        run: |
          if [ ! -x scripts/chart/node_modules/.bin/readme-generator ]; then
              npm --prefix scripts/chart ci --ignore-scripts
          fi
          npm --prefix scripts/chart run generate
          git diff --exit-code -- deploy/helm/sapience/README.md deploy/helm/sapience/values.schema.json
      - name: Generate Compose from the reviewed chart
        uses: astrivant/composer@4ee8ce8507e10b6cbbac607d7bda01e22740cd37
        with:
          watch-directory: '.'
          chart: deploy/helm/sapience
          values: deploy/compose.values.yaml
          profile: deploy/compose.profile.yaml
          release: sapience
          output: deploy/compose.yaml
          commit: 'false'
      - name: Validate orchestration contracts and generated output
        env:
          SAPIENCE_DATABASE_URL: postgresql://sapience:fixture@postgres/sapience?sslmode=disable
          SAPIENCE_POSTGRES_PASSWORD: fixture
        run: |
          helm lint deploy/helm/sapience --strict
          git diff --exit-code -- deploy/compose.yaml
          docker compose -f deploy/compose.yaml config --quiet
          "$RUNNER_TEMP/composer-action-venv/bin/python" -m unittest discover -s scripts/chart/tests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          tags: sapience:0.1.0
          cache-from: type=gha,scope=sapience-runtime
          cache-to: type=gha,scope=sapience-runtime,mode=max
      - name: Verify packaged CLI and SQL resources
        run: |
          docker run --rm sapience:0.1.0 lessons --help
          docker run --rm --entrypoint python sapience:0.1.0 -c             'from importlib.resources import files; assert files("sapience").joinpath("sql/postgres/life/schema.sql").is_file()'

  publish:
    name: Publish signed release
    needs: [tests, lint, privacy, distributions, orchestration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and publish existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish.sh
