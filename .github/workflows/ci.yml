name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: witful-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
jobs:
  codegraph:
    name: CodeGraph SDK compatibility
    uses: ./.github/workflows/stage-codegraph.yml

  native-physical:
    name: Native physical storage
    uses: ./.github/workflows/stage-native-storage.yml
    with:
      source: ${{ github.sha }}

  provider-contracts:
    name: Provider API contracts
    uses: ./.github/workflows/stage-provider-contracts.yml
    with:
      source: ${{ github.sha }}

  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      WITFUL_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Measure package line and branch coverage
        run: >-
          pytest -n 4 pkg/witful scripts/ci/tests tests --cov=witful --cov-branch
          --cov-report=term-missing:skip-covered --cov-report=json:.cache/coverage/report.json
          --cov-report=xml:.cache/coverage/report.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - name: Build measured coverage badge and provenance
        run: node scripts/ci/coverage-badge.mjs .cache/coverage/report.json .cache/coverage/badges "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: .cache/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Public examples are synthetic and never read a maintainer's collection.
  learning:
    name: Continual learning examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: witful reflection example --output-dir .cache/continual-learning
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continual-learning-example
          path: .cache/continual-learning/
          retention-days: 14
          if-no-files-found: error

  lint:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24 action runtime
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: scripts/documentation/package-lock.json
      - run: npm ci --prefix scripts/documentation --ignore-scripts --no-fund
      - run: npm --prefix scripts/documentation test
      - run: pre-commit run codeowners --all-files
      - run: pre-commit run documentation-syntax --all-files
      - run: pre-commit run documentation-javascript --all-files

      - name: Cache the compiled workflow linter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: witful-actionlint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: |
          ruff check pkg scripts tests
          ruff format --check pkg scripts tests
          mypy
          pre-commit run docstrings --all-files
          pre-commit run typed-docstrings --all-files
          sqlfluff lint pkg/witful/sql pkg/witful/storage/tests pkg/witful/life/tests tests/checkpoints tests/native/resources
          git ls-files -z 'scripts/*.sh' 'tests/native/resources/*.sh' | xargs -0 shellcheck -x
          git ls-files -z 'scripts/*.sh' 'tests/native/resources/*.sh' | xargs -0 shfmt -d -i 4 -ci
          pre-commit run actionlint --all-files
          python scripts/documentation/update-contents.py --check
          python -m scripts.native.diagrams --check

  privacy:
    name: PII scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: witful-pii scan

  distributions:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - name: Build immutable tag or source version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python scripts/release/prepare.py
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          poetry build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  orchestration:
    # Chart and image validation are independent of Python tests and plot generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Restore locked operator dependency
        run: bash scripts/chart/dependencies.sh
      - uses: ./.github/actions/python
      - name: Restore chart tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/chart/node_modules
          key: chart-tools-${{ runner.os }}-${{ hashFiles('scripts/chart/package-lock.json') }}
      - name: Regenerate chart documentation and schema
        run: |
          if [ ! -x scripts/chart/node_modules/.bin/readme-generator ]; then
              npm --prefix scripts/chart ci --ignore-scripts
          fi
          npm --prefix scripts/chart run generate
          git diff --exit-code -- helm/witful/README.md helm/witful/values.schema.json helm/witful/references/
      - name: Generate Compose from the reviewed chart
        uses: astrivant/composer@4ee8ce8507e10b6cbbac607d7bda01e22740cd37
        with:
          watch-directory: '.'
          chart: helm/witful
          values: helm/witful/references/local/values.yaml
          profile: services/compose.profile.yaml
          release: witful
          output: services/compose.yaml
          commit: 'false'
      - name: Validate orchestration contracts and generated output
        env:
          WITFUL_DATABASE_URL: postgresql://witful:fixture@postgres/witful?sslmode=disable
          WITFUL_POSTGRES_PASSWORD: fixture
        run: |
          helm lint helm/witful --strict
          git diff --exit-code -- services/compose.yaml
          docker compose -f services/compose.yaml config --quiet
          # Use the project runner so both unittest cases and pytest functions execute.
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest scripts/chart/tests -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime
        id: production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          tags: witful:${{ github.sha }}
          cache-from: type=gha,scope=witful-runtime
          cache-to: type=gha,scope=witful-runtime,mode=max
      - name: Build the development runtime
        id: development
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          push: false
          tags: witful:development-${{ github.sha }}
          cache-from: type=gha,scope=witful-development
          cache-to: type=gha,scope=witful-development,mode=max
      - name: Verify unprivileged runtimes and writable working directories
        env:
          PRODUCTION_IMAGE: ${{ steps.production.outputs.imageid }}
          DEVELOPMENT_IMAGE: ${{ steps.development.outputs.imageid }}
        run: |
          for image in "$PRODUCTION_IMAGE" "$DEVELOPMENT_IMAGE"; do
              docker run --pull=never --rm "$image" --help
              docker run --pull=never --rm --entrypoint sh "$image" -c 'test "$(id -u)" = 10001 && test -w "$PWD"'
          done
      - name: Verify packaged CLI and SQL resources
        env:
          IMAGE_ID: ${{ steps.production.outputs.imageid }}
        run: |
          # Verify the loaded build output directly; never pull a substitute image.
          docker run --pull=never --rm "$IMAGE_ID" lessons --help
          docker run --pull=never --rm --entrypoint python "$IMAGE_ID" -c             'from importlib.resources import files; assert files("witful").joinpath("sql/postgres/life/schema.sql").is_file()'

  coverage-badge:
    name: Publish coverage badge and learning examples
    # Publish both current-run outputs without delaying unrelated source checks.
    needs: [tests, learning]
    if: >-
      github.repository == 'astrivant/identity'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
          path: .cache/coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: continual-learning-example
          path: .cache/coverage/badges/continual-learning
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, Node 24
        with:
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/publish-coverage.mjs`);
            await main({ github, context, core });

  quality-gate:
    name: Required CI
    # Always evaluate the complete producer set, including skipped and cancelled jobs.
    if: always()
    needs: [tests, lint, privacy, security, distributions, orchestration, views, learning, provider-contracts, native-physical, codegraph]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every validation producer
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/checks/quality-gate.sh

  security:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rotate the cache key every six hours so Trivy never restores an older database window.
      - name: Select Trivy database cache window
        id: trivy-cache-key
        run: |
          cache_epoch="$(date -u +%s)"
          cache_window="$((cache_epoch / 21600))"
          echo "key=trivy-db-v1-${RUNNER_OS}-0.75.0-$cache_window" >> "$GITHUB_OUTPUT"

      - name: Prepare Trivy database cache paths
        run: mkdir -p "$RUNNER_TEMP/trivy-cache/db" "$RUNNER_TEMP/trivy-cache/java-db"

      # Cache only downloaded vulnerability databases, not scan results or files from the checkout.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: trivy-cache
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/trivy-cache/db
            ${{ runner.temp }}/trivy-cache/java-db
          key: ${{ steps.trivy-cache-key.outputs.key }}

      # Keep raw findings and diagnostic logs in memory; stdout receives only the sanitized summary.
      - name: Scan source for vulnerabilities and secrets
        id: scan
        continue-on-error: true
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/trivy-results"
          test -d /dev/shm
          sudo swapoff -a
          raw_directory="$(mktemp -d /dev/shm/witful-trivy.XXXXXX)"

          # Remove only this scan's temporary directory, including raw findings and logs.
          # raw_directory::path (owned global), status::exit_code ($?) -> exit::exit_code
          # Exit with the original failure, or 1 when cleanup alone fails.
          cleanup_raw_directory() {
              local exit_status="$?"
              trap - EXIT

              if ! rm -rf -- "$raw_directory"; then
                  printf '%s\n' 'Failed to remove temporary scan data.' >&2
                  if [ "$exit_status" -eq 0 ]; then
                      exit_status=1
                  fi
              fi
              exit "$exit_status"
          }
          trap cleanup_raw_directory EXIT

          docker run --rm --pull=always \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$raw_directory,target=/tmp" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/trivy-cache" \
            --workdir /src \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa fs \
            --config "" \
            --cache-dir /trivy-cache \
            --scanners vuln,secret \
            --format json \
            --output /tmp/raw.json \
            --exit-code 0 \
            --no-progress \
            --timeout 10m \
            --ignorefile "" \
            --secret-config "" \
            --skip-dirs .git \
            . >"$raw_directory/scanner.log" 2>&1
          python3 scripts/ci/checks/trivy-report.py prepare \
            --input "$raw_directory/raw.json" \
            --report-output "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --summary-output "$RUNNER_TEMP/trivy-results/summary.md"

      # Save a complete database only after a successful scan; cache failures must not gate security checks.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          always()
          && steps.scan.outcome == 'success'
          && steps.trivy-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/trivy-cache/db
            ${{ runner.temp }}/trivy-cache/java-db
          key: ${{ steps.trivy-cache-key.outputs.key }}

      # Matched values and source snippets are removed before reports, summaries, or PR comments are published.
      - name: Redact report and summarize findings
        id: prepare
        if: always()
        run: |
          python3 scripts/ci/checks/trivy-report.py prepare \
            --input "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --report-output "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --summary-output "$RUNNER_TEMP/trivy-results/summary.md" \
            --github-output "$GITHUB_OUTPUT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/trivy-results/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.prepare.outputs.available == 'true'
        with:
          name: trivy-scan-report
          path: ${{ runner.temp }}/trivy-results/trivy-report.json
          if-no-files-found: error
          retention-days: 7

      # Findings, an invalid report, or a scanner error fail this reusable stage and therefore CI verification.
      - name: Require a clean Trivy scan
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          REPORT_AVAILABLE: ${{ steps.prepare.outputs.available }}
          FINDING_COUNT: ${{ steps.prepare.outputs.finding_count }}
        run: |
          if [ "$SCAN_OUTCOME" != success ]; then
              echo 'Trivy could not complete the scan; review the scanner logs and report.'
              exit 1
          fi
          if [ "$REPORT_AVAILABLE" != true ]; then
              echo 'Trivy did not produce a valid report.'
              exit 1
          fi
          if [ "$FINDING_COUNT" != 0 ]; then
              echo "Trivy found $FINDING_COUNT secret or vulnerability issue(s)."
              exit 1
          fi

  views:
    name: Render synthetic evidence views
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: bash scripts/ci/render-views.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-evidence-views
          path: docs/assets/project-chapters/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish signed release
    needs: [tests, lint, privacy, security, distributions, orchestration, views, learning, provider-contracts, native-physical, codegraph]
    if: >-
      github.repository == 'astrivant/identity'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    outputs:
      fingerprint: ${{ steps.publication.outputs.fingerprint }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and publish existing artifacts
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish.sh

  release-feedback:
    name: Verify publication and notify contributors
    needs: [publish]
    # A skipped publisher must fail the terminal tag check instead of silently omitting release verification.
    if: >-
      !cancelled()
      && github.repository == 'astrivant/identity'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/stage-release-feedback.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      source: ${{ github.sha }}
      tag: ${{ github.ref_name }}
      publication-result: ${{ needs.publish.result }}
      fingerprint: ${{ needs.publish.outputs.fingerprint }}

  collection:
    name: Refresh private collection
    # Only reviewed main code receives decryption keys; PR checks remain independent and secret-free.
    needs: [tests, lint, privacy, security]
    if: >-
      vars.WITFUL_COLLECTION_ENABLED == 'true'
      && github.event.repository.private
      && github.repository != 'astrivant/identity'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Prepare nonswappable private working storage
        run: |
          sudo swapoff -a
          umask 077
          directory="$(mktemp -d /dev/shm/witful-private.XXXXXX)"
          echo "WITFUL_SECURE_TEMP=$directory" >> "$GITHUB_ENV"
      - name: Verify, decrypt, render, and seal current collection
        env:
          GH_TOKEN: ${{ github.token }}
          WITFUL_COLLECTION_SIGNING_FINGERPRINT: ${{ secrets.WITFUL_COLLECTION_SIGNING_FINGERPRINT }}
          WITFUL_COLLECTION_PRIVATE_KEY: ${{ secrets.WITFUL_COLLECTION_PRIVATE_KEY }}
          WITFUL_COLLECTION_PUBLIC_KEY: ${{ secrets.WITFUL_COLLECTION_PUBLIC_KEY }}
          WITFUL_COLLECTION_KEY_PASSWORD: ${{ secrets.WITFUL_COLLECTION_KEY_PASSWORD }}
          WITFUL_COLLECTION_NEXT_KEYS: ${{ secrets.WITFUL_COLLECTION_NEXT_KEYS }}
          COSIGN_PRIVATE_KEY: ${{ secrets.WITFUL_COLLECTION_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.WITFUL_COLLECTION_SIGNING_PASSWORD }}
        run: bash scripts/collection/refresh.sh
      - name: Check source publication boundary
        run: witful-pii scan
      - name: Retain verified encrypted candidates and old-generation recovery snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-collection-candidate
          path: |
            ${{ env.WITFUL_SECURE_TEMP }}/publication/current
            ${{ env.WITFUL_SECURE_TEMP }}/publication/previous
            ${{ env.WITFUL_SECURE_TEMP }}/publication/rotated
            ${{ env.WITFUL_SECURE_TEMP }}/publication/VERIFIED
            ${{ env.WITFUL_SECURE_TEMP }}/publication/READY
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Update the private main dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collection/publish.sh
      - name: Remove decrypted temporary directories after cancellation or failure
        if: always()
        shell: bash
        run: |
          if [ -n "${WITFUL_SECURE_TEMP:-}" ] && [[ "$WITFUL_SECURE_TEMP" == /dev/shm/witful-private.* ]]; then
              rm -rf -- "$WITFUL_SECURE_TEMP"
          fi

  trivy-pr-comment:
    name: Trivy PR summary
    needs: [security]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && needs.security.result != 'cancelled'
      && needs.security.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # Use trusted default-branch code to interpret the sanitized artifact, never scripts from the PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: trivy-scan-report
          path: ${{ runner.temp }}/trivy-results

      - name: Locate trusted reporting helper
        id: helper
        run: |
          if [ -f scripts/ci/checks/trivy-report.py ]; then
              echo 'available=true' >> "$GITHUB_OUTPUT"
          else
              echo 'PR comment helper is not on main yet; use the scan summary and artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve the report and create a safe comment payload
        if: steps.helper.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "trivy-scan-report")][0].id // empty')"
          artifact_url=
          if [ -n "$artifact_id" ]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$artifact_id"
          fi
          python3 scripts/ci/checks/trivy-report.py comment \
            --input "$RUNNER_TEMP/trivy-results/trivy-report.json" \
            --output "$RUNNER_TEMP/trivy-comment.json" \
            --artifact-url "$artifact_url" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

      - name: Create or update the pull request comment
        if: steps.helper.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing_comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- identity-trivy-scan -->")) | .id' | tail -n 1)"
          if [ -n "$existing_comment_id" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --input "$RUNNER_TEMP/trivy-comment.json"
          fi
