name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: witful-${{ github.ref }}
  cancel-in-progress: false
env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      WITFUL_TEST_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: pytest -n 4 pkg/witful scripts/ci/tests

  lint:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24 action runtime
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: scripts/documentation/package-lock.json
      - run: npm ci --prefix scripts/documentation --ignore-scripts --no-fund
      - run: npm --prefix scripts/documentation test
      - run: pre-commit run codeowners --all-files
      - run: pre-commit run documentation-syntax --all-files
      - run: pre-commit run documentation-javascript --all-files
      - run: |
          ruff check pkg scripts
          ruff format --check pkg scripts
          mypy
          pre-commit run docstrings --all-files
          pre-commit run typed-docstrings --all-files
          sqlfluff lint pkg/witful/sql pkg/witful/storage/tests pkg/witful/life/tests pkg/witful/checkpoints/tests
          git ls-files -z 'scripts/*.sh' | xargs -0 shellcheck -x
          git ls-files -z 'scripts/*.sh' | xargs -0 shfmt -d -i 4 -ci
          python scripts/documentation/update-contents.py --check

  privacy:
    name: PII scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - run: witful privacy scan

  distributions:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - name: Build immutable tag or source version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python scripts/release/prepare.py
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          poetry build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  orchestration:
    # Chart and image validation are independent of Python tests and plot generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore chart tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/chart/node_modules
          key: chart-tools-${{ runner.os }}-${{ hashFiles('scripts/chart/package-lock.json') }}
      - name: Regenerate chart documentation and schema
        run: |
          if [ ! -x scripts/chart/node_modules/.bin/readme-generator ]; then
              npm --prefix scripts/chart ci --ignore-scripts
          fi
          npm --prefix scripts/chart run generate
          git diff --exit-code -- helm/witful/README.md helm/witful/values.schema.json helm/witful/references/
      - name: Generate Compose from the reviewed chart
        uses: astrivant/composer@4ee8ce8507e10b6cbbac607d7bda01e22740cd37
        with:
          watch-directory: '.'
          chart: helm/witful
          values: helm/witful/references/local/values.yaml
          profile: services/compose.profile.yaml
          release: witful
          output: services/compose.yaml
          commit: 'false'
      - name: Validate orchestration contracts and generated output
        env:
          WITFUL_DATABASE_URL: postgresql://witful:fixture@postgres/witful?sslmode=disable
          WITFUL_POSTGRES_PASSWORD: fixture
        run: |
          helm lint helm/witful --strict
          git diff --exit-code -- services/compose.yaml
          docker compose -f services/compose.yaml config --quiet
          "$RUNNER_TEMP/composer-action-venv/bin/python" -m unittest discover -s scripts/chart/tests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          tags: witful:0.1.0
          cache-from: type=gha,scope=witful-runtime
          cache-to: type=gha,scope=witful-runtime,mode=max
      - name: Build the development runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          push: false
          tags: witful:development
          cache-from: type=gha,scope=witful-development
          cache-to: type=gha,scope=witful-development,mode=max
      - name: Verify unprivileged runtimes and writable working directories
        run: |
          for image in witful:0.1.0 witful:development; do
              docker run --rm "$image" --help
              docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" = 10001 && test -w "$PWD"'
          done
      - name: Verify packaged CLI and SQL resources
        run: |
          docker run --rm witful:0.1.0 lessons --help
          docker run --rm --entrypoint python witful:0.1.0 -c             'from importlib.resources import files; assert files("witful").joinpath("sql/postgres/life/schema.sql").is_file()'

  quality-gate:
    name: Required CI
    # Always evaluate the complete producer set, including skipped and cancelled jobs.
    if: always()
    needs: [tests, lint, privacy, distributions, orchestration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every validation producer
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/checks/quality-gate.sh

  publish:
    name: Publish signed release
    needs: [tests, lint, privacy, distributions, orchestration]
    if: >-
      github.repository == 'astrivant/identity'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and publish existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release/publish.sh

  collection:
    name: Refresh private collection
    # Only reviewed main code receives decryption keys; PR checks remain independent and secret-free.
    needs: [tests, lint, privacy]
    if: >-
      vars.WITFUL_COLLECTION_ENABLED == 'true'
      && github.event.repository.private
      && github.repository != 'astrivant/identity'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify, decrypt, render, and seal current collection
        env:
          GH_TOKEN: ${{ github.token }}
          WITFUL_COLLECTION_PRIVATE_KEY: ${{ secrets.WITFUL_COLLECTION_PRIVATE_KEY }}
          WITFUL_COLLECTION_PUBLIC_KEY: ${{ secrets.WITFUL_COLLECTION_PUBLIC_KEY }}
          WITFUL_COLLECTION_KEY_PASSWORD: ${{ secrets.WITFUL_COLLECTION_KEY_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.WITFUL_COLLECTION_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.WITFUL_COLLECTION_SIGNING_PASSWORD }}
        run: witful collection refresh
      - name: Check publication boundary
        run: witful privacy scan
      - name: Retain only encrypted figures and verification material
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-collection-figures
          path: |
            collection/figures.enc.json
            collection/figures.enc.json.sigstore.json
            collection/figures.enc.json.sha256
            collection/cosign.pub
            collection/key-fingerprints.json
            .config/collection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Update the private main dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collection/publish.sh
      - name: Remove decrypted temporary directories after cancellation or failure
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'witful-plain-*' -exec rm -rf -- {} +
