name: Release feedback
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      tag:
        required: true
        type: string
      publication-result:
        required: true
        type: string
      fingerprint:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-feedback-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Require completed publication
        env:
          PUBLICATION_RESULT: ${{ inputs.publication-result }}
        run: test "$PUBLICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify public files and send missing release comments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ inputs.source }}
          RELEASE_SIGNING_FINGERPRINT: ${{ inputs.fingerprint }}
        run: >-
          python -m scripts.release.cli --source "$SOURCE_REVISION" notify
          --built dist --download "$RUNNER_TEMP/release-download"
          --fingerprint "$RELEASE_SIGNING_FINGERPRINT"
          --receipt .cache/release-feedback/receipt.json
      - name: Retain partial reporting outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-feedback
          path: .cache/release-feedback/receipt.json
          if-no-files-found: warn
          retention-days: 30
