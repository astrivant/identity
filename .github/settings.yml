repository:
  name: identity
  description: A user-owned policy and learning layer for intelligent agents, powered by Witful
  homepage: https://github.com/astrivant/identity/blob/main/docs/CLI.md
  private: false
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        checks:
          - context: Required CI
            app_id: 15368
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      enforce_admins: false
      restrictions: null
