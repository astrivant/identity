repository:
  name: identity
  description: Typed lessons, observed reuse, and replayable engineering decisions with Sapience
  homepage: https://pypi.org/project/sapience/
  private: false
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: [Python tests, Source checks, PII scan, Build distributions, orchestration]
      enforce_admins: false
      restrictions: null
