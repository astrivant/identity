   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(127.404141 186.992344)">1. Accepted encrypted intent</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(113.747578 202.217344)">Destination, permit key and policy</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(126.726562 217.442344)">Retained with original receipt</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(520.159688 186.992344)">2. Explicit scheduling</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(484.770586 202.217344)">Manual / interval / batch / required</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(493.237852 217.442344)">Disabled retains accepted work</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(875.636133 186.992344)">3. Persist exact preparation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(854.8125 202.217344)">Archive + Git OID + expected head</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(859.769648 217.442344)">Signed permit; no remote call yet</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(877.006875 363.872344)">4. Persist attempt / backoff</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(883.169883 380.114531)">State becomes unknown</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(876.290742 394.322344)">Before first transport effect</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(524.403984 363.872344)">5. Isolated gateway</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(499.985742 379.097344)">Current caller + writer policy</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(485.478516 394.322344)">Permit-only unwrap; verify archive</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(125.553516 363.872344)">6. SSH expected-head update</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(129.614883 379.097344)">Parent-preserving candidate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(125.01457 394.322344)">Divergence blocks publication</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(134.173359 540.752344)">7. Independent fresh fetch</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(135.791836 556.581914)">Exact commit / tree / blob</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(143.666836 572.219531)">Recheck advertised ref</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(511.217461 540.752344)">8. Retain verified receipt</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(497.327109 556.994531)">Advance observed watermark</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(483.883008 571.202344)">Remove only matching queue item</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(879.722109 540.752344)">9. Original target-set gate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(856.452305 555.977344)">Missing evidence stays incomplete</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(870.364805 571.202344)">Timer never proves durability</text>
   </g>
