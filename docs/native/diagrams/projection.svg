   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle" x="576" y="50.044875" transform="rotate(-0 576 50.044875)">Projection timing and custody</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30414a" x="576" y="74.029969" transform="rotate(-0 576 74.029969)">When may remote history lag, and what proves delivery?</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 706.706406)">Default policy is disabled. Configured defaults: 60 s interval, batch 8, lag budget 3600 s, retry 1 to 60 s, 5 attempts; actual accepted targets and key generation</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 720.956406)">are immutable intent data. Entry/byte/lag pressure refuses affected writes. Full snapshots retain history and amplify storage; limits are not an incremental format.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #30414a" x="46.08" y="766.656" transform="rotate(-0 46.08 766.656)">GREEN authoritative  |  AMBER durable pending  |  BLUE replicated projection  |  PURPLE disposable cache  |  GRAY service</text>
  </g>
 </g>
