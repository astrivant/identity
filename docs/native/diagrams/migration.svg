    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #30414a" transform="translate(714.957813 541.241078)">no configuration-only</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #30414a" transform="translate(755.213 551.803484)">flip</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle" x="576" y="50.044875" transform="rotate(-0 576 50.044875)">Migration and rollback</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30414a" x="576" y="74.029969" transform="rotate(-0 576 74.029969)">What permits a routing change without losing accepted history?</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 706.706406)">Git and PostgreSQL preserve the canonical native history sidecar. Exact original Git objects and OIDs are retained by the archive profile, not rewritten to represent</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 720.956406)">new exports. Unsupported reverse representations block rollback. Retention cleanup, private migration and pilot enrollment require separate approval.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #30414a" x="46.08" y="766.656" transform="rotate(-0 46.08 766.656)">GREEN authoritative  |  AMBER durable pending  |  BLUE replicated projection  |  PURPLE disposable cache  |  GRAY service</text>
  </g>
 </g>
