   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(139.645664 186.992344)">1. Explicit reviewed plan</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(115.286484 202.217344)">Exact source / destination / scope</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(120.057422 217.442344)">Permissions, keys, backup proof</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(499.742109 186.992344)">2. Pin snapshot + watermark</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(504.495 202.217344)">Complete approved history</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(492.091875 217.442344)">Retain exact original Git objects</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(894.202266 186.992344)">3. Encrypted backfill</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(874.404023 202.217344)">Immutable IDs + signatures</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(869.331211 217.442344)">Idempotent exact-byte copies</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(870.004688 363.872344)">4. Catch up committed deltas</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(863.109141 379.097344)">Refs, receipts, mappings, grants</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(861.473438 395.339531)">No silent second writable master</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(527.206992 364.889531)">5. Fence and drain</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(493.643086 379.097344)">Resolve pending source/outbox</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(505.38668 394.322344)">Final complete comparison</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(138.989414 363.779648)">6. Exact cutover prepare</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(117.206016 379.097344)">Atomic backend + epoch change</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(123.388711 394.322344)">Old epoch immediately denied</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(145.213945 540.752344)">7. Verify target canary</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(106.581328 555.977344)">New writes / read / branch / recovery</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(133.380938 571.202344)">Retain old source and keys</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(503.093086 541.769531)">8. Rollback after new writes</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(495.191016 555.977344)">Fence target; reverse catch-up</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(485.33168 571.202344)">Include every new accepted effect</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(879.015 541.769531)">9. Verified reverse frontier</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(861.964805 555.977344)">Same integrity / permission gate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(864.755508 571.202344)">New epoch, then routing switch</text>
   </g>
