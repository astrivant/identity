   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle" x="576" y="50.044875" transform="rotate(-0 576 50.044875)">Write and acknowledgment</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30414a" x="576" y="74.029969" transform="rotate(-0 576 74.029969)">What must be durable before a caller receives success?</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 706.574297)">PostgreSQL synchronous mode requires remote_apply and a configured synchronous standby. Local Git fsyncs objects and the root transition under an inherited process</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 720.956406)">lock. An unknown commit is recovered by exact operation ID. No remote-required completion is inferred from an empty queue.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #30414a" x="46.08" y="766.656" transform="rotate(-0 46.08 766.656)">GREEN authoritative  |  AMBER durable pending  |  BLUE replicated projection  |  PURPLE disposable cache  |  GRAY service</text>
  </g>
 </g>
