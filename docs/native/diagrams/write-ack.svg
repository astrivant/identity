   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(138.594023 186.992344)">1. Authenticated request</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(127.035 202.217344)">Tenant / subject / grant / task</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(153.234141 217.442344)">Stable operation ID</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(506.972344 186.992344)">2. Current authority check</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(494.023711 202.217344)">Policy + epoch + exact frontier</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(507.836133 218.459531)">Reauthorize cached reads</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(896.310469 188.009531)">3. Validate and seal</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(858.479297 202.217344)">Fresh DEK + nonce; pinned signer</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(881.66707 217.442344)">Explicit envelope context</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(882.381562 363.872344)">4. Durable exact prepare</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(876.234141 379.097344)">Authority retains candidate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(872.102227 394.322344)">Uncertainty blocks new work</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(507.089648 363.779648)">5. Source acceptance CAS</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(483.52043 379.097344)">Objects + head + receipt + outbox</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(498.622383 394.926914)">One database/Git transaction</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(126.294258 363.872344)">6. Authority acknowledgment</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(122.54707 379.097344)">Read back accepted exact root</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(126.496055 394.322344)">Clear matching pending work</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(142.080352 540.752344)">7. Local durable receipt</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(120.650508 555.977344)">Client observes new generation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(120.205078 571.202344)">Invalidate stale memory entries</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(503.816602 540.752344)">8. Optional remote delivery</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(494.593828 555.977344)">Separate retained requirement</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(497.964492 571.202344)">Local receipt remains durable</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(885.848203 540.752344)">9. Workload completion</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(871.601016 555.977344)">All originally required targets</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(866.202539 571.202344)">Must be independently verified</text>
   </g>
