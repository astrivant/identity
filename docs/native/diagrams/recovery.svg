   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(138.188789 186.992344)">Failure or uncertain reply</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(118.868789 202.217344)">Process / network / provider loss</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(124.339453 217.442344)">Keep operation ID and frontier</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(501.120234 188.009531)">Source transaction unknown</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(499.48043 203.234531)">Resolve exact retained batch</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(519.688828 217.442344)">Never guess absence</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(878.593359 186.992344)">Authority pending prepare</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(875.242383 202.217344)">Verify committed candidate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(870.290977 217.442344)">Then acknowledge or resume</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(150.093164 363.872344)">Primary or node loss</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(117.283125 379.097344)">Fence old primary independently</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(141.268242 394.322344)">Promote verified replica</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(521.297461 363.872344)">New authority epoch</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(502.139883 379.097344)">Reject every stale controller</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(504.04875 394.322344)">Reconcile accepted frontier</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(894.270352 363.872344)">Key or policy outage</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(859.544883 379.097344)">Block decrypt / write / publication</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(868.974375 394.322344)">Do not serve cached plaintext</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(129.572227 540.752344)">Remote reply lost / diverged</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(116.672813 555.977344)">Reuse exact bytes and read back</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(113.859961 571.202344)">Divergence needs reviewed repair</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(519.861094 540.752344)">Backup / PITR restore</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(498.605156 555.977344)">Inactive target; retained keys</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(494.492109 571.202344)">Verify counts, signatures, roots</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(868.998164 540.752344)">Resume only after verification</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(858.349687 555.977344)">Reconcile remote effects + grants</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(877.645078 572.219531)">No revived revoked access</text>
   </g>
