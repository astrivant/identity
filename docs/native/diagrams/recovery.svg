  <g id="text_17">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle" x="576" y="50.044875" transform="rotate(-0 576 50.044875)">Failure and recovery boundaries</text>
  </g>
  <g id="text_18">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #30414a" x="576" y="74.029969" transform="rotate(-0 576 74.029969)">Which durable evidence permits recovery, and where must work stop?</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 706.706406)">Physical drill uses a killed primary, synchronous replica promotion and separate PITR from verified base backup plus archived WAL. Recovery times are local</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(46.08 720.956406)">observations. Operator owns old-primary fencing, encrypted volumes, backup retention and restore trust. A live replica is not an independent backup.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #30414a" x="46.08" y="766.656" transform="rotate(-0 46.08 766.656)">GREEN authoritative  |  AMBER durable pending  |  BLUE replicated projection  |  PURPLE disposable cache  |  GRAY service</text>
  </g>
