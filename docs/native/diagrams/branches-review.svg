    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263642" x="762" y="546.522281" transform="rotate(-0 762 546.522281)">if policy requires</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263642" x="576" y="50.044875" transform="rotate(-0 576 50.044875)">Branches and reviewed derivation</text>
  </g>
  <g id="text_19">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263642" x="576" y="74.029969" transform="rotate(-0 576 74.029969)">Which gates separate a branch, disclosed child history and semantic adoption?</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(46.08 706.706406)">Fork/split creates selected child histories under separately provisioned scopes. The caller cannot acquire parent or sibling visibility from a child name. Group</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(46.08 720.956406)">recovery preserves prepared bytes even if current scheduling changes. Ordinary branch publication does not require a derivation group.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263642" x="46.08" y="766.656" transform="rotate(-0 46.08 766.656)">OLIVE authoritative  |  COPPER durable pending  |  BLUE replicated projection  |  CREAM disposable cache  |  GRAY service</text>
  </g>
 </g>
