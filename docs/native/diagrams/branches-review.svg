   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(149.380313 188.009531)">1. Pin source frontier</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(138.779414 202.217344)">Ordered revision parents</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(138.266719 217.442344)">Expected heads + epoch</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(533.872852 186.992344)">2a. Branch / tag</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(505.036406 202.217344)">Reference existing revision</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(499.617422 218.459531)">Source remains authoritative</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(882.868008 186.992344)">2b. Fork / split candidate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(877.003594 202.217344)">Explicit selected disclosure</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(863.861367 217.442344)">Independent child scope + keys</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(878.783672 364.889531)">3. Review exact candidate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(865.185352 379.097344)">Source and child grants current</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(879.944414 394.322344)">Parent adoption is explicit</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(516.159844 363.710742)">4. Prepare exact group</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(490.157578 379.097344)">Retain project/export obligations</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(508.028906 394.322344)">Freeze all affected scopes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(140.119805 363.872344)">5. Apply / verify batches</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(119.305195 379.097344)">Stable IDs; byte-identical retries</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(122.904727 394.322344)">No partial public group frontier</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(122.761992 540.752344)">6. Atomic authority publication</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(136.306992 555.977344)">All group receipts present</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(131.467969 571.202344)">Advance complete frontiers</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(507.123281 541.769531)">7. Reviewed reconciliation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(491.269102 555.977344)">Pinned head(s), ordered parents</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(500.417227 571.202344)">No rewrite of source journals</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(865.899023 540.752344)">8. Separate remote verification</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(868.713516 555.977344)">Each accepted intent retained</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263642" transform="translate(879.086367 571.202344)">Adoption is not replication</text>
   </g>
