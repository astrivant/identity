# Generated by Composer from Helm and a runtime profile; regenerate instead of editing.
name: witful-local
services:
  witful:
    image: witful:0.1.0
    user: 10001:10001
    group_add:
      - '10001'
    entrypoint:
      - witful
    command:
      - lessons
      - --repo
      - /source
      - sync
    networks: &service_networks
      - default
    cpus: 1.0
    mem_limit: 536870912
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      target: production
    environment:
      WITFUL_DATABASE_URL: ${WITFUL_DATABASE_URL:?Set the local PostgreSQL URI}
      WITFUL_DATABASE_NAMESPACE: ${WITFUL_DATABASE_NAMESPACE:-default}
    volumes:
      - ../lessons.jsonl:/source/lessons.jsonl:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    deploy:
      replicas: 1
  postgres:
    image:
      postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    networks: *service_networks
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - witful
        - -d
        - witful
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 1.0
    mem_limit: 536870912
    expose:
      - '5432'
    environment:
      POSTGRES_DB: witful
      POSTGRES_USER: witful
      POSTGRES_PASSWORD: ${WITFUL_POSTGRES_PASSWORD:?Set the local database
        password}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
volumes:
  postgres-data: {}
