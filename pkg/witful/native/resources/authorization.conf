[request_definition]
r = grant, subject, task, action, record, now

[policy_definition]
p = unused

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.grant.subject == r.subject && r.grant.task == r.task && r.action in r.grant.actions && (r.record in r.grant.records || "*" in r.grant.records) && r.grant.starts <= r.now && r.now < r.grant.expires
