repos:
  - repo: local
    hooks:
      - id: witful-pii
        name: PII scan
        entry: witful-pii scan --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: docstrings
        name: Google docstrings
        entry: pydocstyle
        language: system
        types: [python]
      - id: typed-docstrings
        name: Typed docstring contracts
        entry: pydoclint
        language: system
        types: [python]
      - id: sql
        name: SQLFluff
        entry: sqlfluff lint
        language: system
        types: [sql]
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -x
        language: system
        types: [shell]
      - id: shfmt
        name: Shell format
        entry: shfmt -d -i 4 -ci
        language: system
        types: [shell]
      - id: chart-documentation
        name: Helm documentation and schema
        entry: npm --prefix scripts/chart run generate
        language: system
        pass_filenames: false
        files: '^(helm/|scripts/chart/)'
      - id: documentation-contents
        name: README contents
        entry: python scripts/documentation/update-contents.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astrivant/composer
    rev: 4ee8ce8507e10b6cbbac607d7bda01e22740cd37
    hooks:
      - id: helm-composer
        files: '^(helm/|services/)'
        args: [--chart=helm/witful, --values=services/compose.values.yaml, --profile=services/compose.profile.yaml,
               --release=witful, --output=services/compose.yaml]
  # The maintained workflow parser sends inline shell to the same installed ShellCheck.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        entry: bash scripts/ci/checks/actionlint.sh
        pass_filenames: false
        always_run: true
