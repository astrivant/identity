default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: witful-pii
        name: PII scan
        entry: witful-pii scan --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: generated-artifact-inventory
        name: Generated artifact repair inventory
        entry: python scripts/ci/repair/plan.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: codeowners-tree
        name: Normalize CODEOWNERS in directory order
        entry: python -m scripts.ownership --write
        language: system
        pass_filenames: false
        always_run: true
      - id: codeowners-tree-push
        name: Verify committed CODEOWNERS tree
        entry: python -m scripts.ownership --check --revision HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: codeowners
        name: CODEOWNERS syntax and paths
        entry: env REPOSITORY_PATH=. CHECKS=files,duppatterns,syntax EXPERIMENTAL_CHECKS= CHECK_FAILURE_LEVEL=warning codeowners-validator
        language: golang
        language_version: 1.27.2
        additional_dependencies:
          - github.com/mszostok/codeowners-validator@7f3f5e28c6d7b8dfae5731e54ce2272ca384592f # v0.7.4
        pass_filenames: false
        always_run: true
      - id: documentation-source-links
        name: Documentation source links
        entry: python scripts/documentation/source-links.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push, manual]
      - id: documentation-source-link-contracts
        name: Source-link boundary regressions
        entry: python scripts/documentation/check-source-link-contracts.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push, manual]
      - id: ruff
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: docstrings
        name: Google docstrings
        entry: pydocstyle
        language: system
        types: [python]
      - id: typed-docstrings
        name: Typed docstring contracts
        entry: pydoclint
        language: system
        types: [python]
      - id: sql
        name: SQLFluff
        entry: sqlfluff lint
        language: system
        types: [sql]
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -x
        language: system
        types: [shell]
      - id: shfmt
        name: Shell format
        entry: shfmt -d -i 4 -ci
        language: system
        types: [shell]
      - id: chart-dependencies
        name: Restore locked Helm dependencies
        entry: bash scripts/chart/dependencies.sh
        language: system
        pass_filenames: false
        files: '^(helm/|scripts/chart/|services/)'
      - id: chart-documentation
        name: Helm documentation and schema
        entry: npm --prefix scripts/chart run generate
        language: system
        pass_filenames: false
        files: '^(helm/|scripts/chart/)'
      - id: native-storage-diagrams
        name: Native storage diagram source and artifact bindings
        entry: python -m scripts.native.diagrams --check
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-contents
        name: README contents
        entry: python scripts/documentation/update-contents.py
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-syntax
        name: Markdown math and Mermaid syntax
        entry: npm --prefix scripts/documentation run check
        language: system
        pass_filenames: false
        always_run: true
      - id: markdown-lint
        name: Markdown rendering structure
        entry: npm --prefix scripts/documentation run markdown:lint
        language: system
        pass_filenames: false
        always_run: true
      - id: readme-format
        name: README Markdown formatting
        entry: npm --prefix scripts/documentation run format:check
        language: system
        pass_filenames: false
        files: '^(README\.md|scripts/documentation/)'
      - id: documentation-javascript
        name: Documentation tooling JavaScript
        entry: npm --prefix scripts/documentation run lint
        language: system
        pass_filenames: false
        files: '^(scripts/(documentation|ci)|services/codegraph)/.*\.(mjs|json)$'
  - repo: https://github.com/astrivant/composer
    rev: 4ee8ce8507e10b6cbbac607d7bda01e22740cd37
    hooks:
      - id: helm-composer
        files: '^(helm/|services/)'
        args: [--chart=helm/witful, --values=helm/witful/references/local/values.yaml, --profile=services/compose.profile.yaml,
               --release=witful, --output=services/compose.yaml]
  # The maintained workflow parser sends inline shell to the same installed ShellCheck.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        entry: bash scripts/ci/checks/actionlint.sh
        pass_filenames: false
        always_run: true
