schemaVersion: 1
name: witful-local
services:
  witful:
    source:
      kind: Job
      name: witful-sync-1
    container: witful
    remove: [/volumes, /environment, /restart, /container_name]
    set:
      read_only: true
      cap_drop: [ALL]
      security_opt: [no-new-privileges:true]
      build:
        context: ..
        dockerfile: services/witful/Dockerfile
        target: production
      environment:
        WITFUL_DATABASE_URL: "${WITFUL_DATABASE_URL:?Set the local PostgreSQL URI}"
        WITFUL_DATABASE_NAMESPACE: "${WITFUL_DATABASE_NAMESPACE:-default}"
      volumes:
        - "../lessons.jsonl:/source/lessons.jsonl:ro"
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"
      deploy:
        replicas: {$values: /sync/workers}
  postgres:
    source:
      kind: Cluster
      name: witful-postgres
    remove: [/volumes, /environment, /ports, /container_name]
    set:
      # Compose substitutes a local database; the Cluster controller only runs in Kubernetes.
      image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      init: true
      cpus: 1.0
      mem_limit: 512m
      stop_grace_period: 60s
      environment:
        POSTGRES_DB: {$resource: /spec/bootstrap/initdb/database}
        POSTGRES_USER: {$resource: /spec/bootstrap/initdb/owner}
        POSTGRES_PASSWORD: "${WITFUL_POSTGRES_PASSWORD:?Set the local database password}"
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        test: [CMD, pg_isready, -U, {$resource: /spec/bootstrap/initdb/owner}, -d, {$resource: /spec/bootstrap/initdb/database}]
        interval: 5s
        timeout: 3s
        retries: 12
      restart: unless-stopped
volumes:
  postgres-data: {}
