schemaVersion: 1
name: witful-local
services:
  witful:
    source:
      kind: Job
      name: witful-sync-1
    container: witful
    remove: [/volumes, /environment, /restart, /container_name]
    set:
      read_only: true
      cap_drop: [ALL]
      security_opt: [no-new-privileges:true]
      build:
        context: ..
        target: production
      environment:
        WITFUL_DATABASE_URL: "${WITFUL_DATABASE_URL:?Set the local PostgreSQL URI}"
        WITFUL_DATABASE_NAMESPACE: "${WITFUL_DATABASE_NAMESPACE:-default}"
      volumes:
        - "../lessons.jsonl:/source/lessons.jsonl:ro"
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"
      deploy:
        replicas: {$values: /workers}
  postgres:
    source:
      kind: StatefulSet
      name: witful-postgres
    container: postgres
    remove: [/volumes, /environment, /ports, /container_name]
    set:
      environment:
        POSTGRES_DB: {$values: /postgresql/database}
        POSTGRES_USER: {$values: /postgresql/username}
        POSTGRES_PASSWORD: "${WITFUL_POSTGRES_PASSWORD:?Set the local database password}"
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        test: [CMD, pg_isready, -U, {$values: /postgresql/username}, -d, {$values: /postgresql/database}]
        interval: 5s
        timeout: 3s
        retries: 12
      restart: unless-stopped
volumes:
  postgres-data: {}
